name: SoCo Bot

on:
  schedule:
    - cron: "17 14 * * *"  # daily ~10am ET; the script only posts every 2 days
  workflow_dispatch:
    inputs:
      mode:
        description: "due = post only if 2 days passed, force = post now, dry-run = preview only"
        type: choice
        options: [due, force, dry-run]
        default: dry-run

permissions:
  contents: write  # to commit posted.json to the bot-state branch

concurrency: soco-bot

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The posted history lives on its own branch so the bot never commits to main.
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          path: state
      - run: cp state/posted.json posted.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python soco_bot.py ${{ inputs.mode && inputs.mode != 'due' && format('--{0}', inputs.mode) || '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Save posted history
        working-directory: state
        run: |
          cp ../posted.json posted.json
          git config user.name "soco-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "SoCo Bot: record posted story" && git push)
